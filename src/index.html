<!doctype html>
<html lang="en" data-theme="lavender">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gloria Jeans — Transport driver app</title>
    <!-- Paints the saved theme before React loads: NO_FLASH_SCRIPT from @zp/ui, inlined. -->
    <script>try{var L={sage:"olive",light:"lavender",dark:"lavender-dark"};var t=localStorage.getItem("plm.theme")||"lavender";t=L[t]||t;var d=["lavender-dark","midnight"];if(localStorage.getItem("plm.theme.followSystem")==="1"&&matchMedia("(prefers-color-scheme: dark)").matches&&d.indexOf(t)<0)t="lavender-dark";document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
